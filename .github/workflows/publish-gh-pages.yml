name: Publish to GitHub Pages

# Reconstruct the WHOLE versioned docs site from durable sources (the consumer's
# default-branch build, release docs.zip assets, open-PR build artifacts) and deploy it
# directly to GitHub Pages — no gh-pages branch. The PRIVILEGED half, and a reusable
# workflow: its only caller is a `publish.yml` in the consumer's repo, triggered by
# `workflow_run` when their CI completes.
#
# Two properties of that trigger shape the code below:
#
#   - GITHUB_SHA and github.ref are ALWAYS the default branch's HEAD, never the commit
#     that was built — a PR-triggered deploy reports `refs/heads/main`. Anything asking
#     "was this the default branch?" must read `github.event.workflow_run.head_branch`.
#   - Pages stamps each deployment with `pages_build_version = GITHUB_SHA` and silently
#     no-ops a repeat (actions/deploy-pages#383), EXCEPT on `workflow_run` and
#     `workflow_dispatch`, which force a re-serve. So a tag cut on an already-deployed
#     commit still updates the origin, with no re-dispatch machinery.
#
# The pure logic is assemble.mjs; the IO plumbing is inline steps here. To version-match
# assemble.mjs to this workflow we check out its OWN repo at its OWN commit via the `job`
# context: unlike github.workflow_* (which resolve to the CALLER's entry workflow),
# `job.workflow_repository` + `job.workflow_sha` resolve to the file that defines THIS
# job — the reusable workflow at the ref a consumer pinned it to. assemble.mjs runs
# `git tag` in the cwd, so the CONSUMER's repo is checked out at the root (with tags) to
# supply their version list; assemble.mjs itself comes from .mvs.
on:
  workflow_call:
    inputs:
      pr:
        description: External fork PR number to approve (pins its head SHA) and preview.
        required: false
        default: ""
        type: string
      max-releases:
        description: >-
          Publish only the N most recent releases (by the tagged commit's date), or 0 for
          all of them. The site is deployed as ONE Pages artifact and Pages caps that at
          1 GB, so an old project with hundreds of released docs.zips will eventually
          fail to deploy at all. It also bounds the release-zip cache entry, which
          counts against the repo's 10 GB Actions cache quota. Set this in your
          publish.yml's `with:` block so it applies on every path.
        required: false
        default: "0"
        type: string
      max-prs:
        description: >-
          Publish previews for only the N most recently built open PRs, or 0 for all of
          them. Same 1 GB ceiling as max-releases: a repo with dozens of open PRs carries
          a preview for each on every deploy. Set this in your publish.yml's `with:`
          block so it applies on every path.
        required: false
        default: "0"
        type: string

jobs:
  # The only job. The caller has already gated on the triggering run having SUCCEEDED and
  # not being from a fork, so there is nothing left to branch on here.
  deploy:
    runs-on: ubuntu-latest
    # The whole deploy: a cold release-zip cache, the assemble, the upload, and up to
    # ~6 min of origin verification at the end. 45 leaves room for a slow Pages backend
    # while still failing the same day.
    timeout-minutes: 45
    permissions:
      contents: read     # checkout + read release assets
      actions: read      # gather cross-run docs artifacts
      pages: write       # deploy to Pages
      id-token: write    # deploy-pages OIDC
      statuses: write    # set the preview-approved status on a fork PR head SHA
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # QUEUE superseded deploys; do not cancel them. The old `cancel-in-progress: true`
    # was argued from artifact correctness — every deploy reconstructs the whole site
    # from durable sources, so the next one gathers everything the cancelled one would
    # have — and that argument still holds. It is just not the question. Cancelling
    # kills the job mid-`deploy-pages`, in the window between the artifact being
    # uploaded and the Pages backend finishing with it, which is a backend state we do
    # not control and cannot inspect; GitHub's own Pages starter workflow uses `false`
    # for exactly this reason, and this workflow already carries a step for detecting a
    # wedged origin, so the failure it guards against is not hypothetical here.
    #
    # The cost is bounded: a concurrency group holds at most ONE pending run, and a
    # newer arrival cancels the older PENDING one (before it starts, harmlessly). So a
    # burst of pushes costs one extra full-site deploy, not a pile-up.
    concurrency:
      group: pages
      cancel-in-progress: false
    env:
      REPO: ${{ github.repository }}
      # The branch that was actually BUILT — see the header: github.ref is the default
      # branch even for a PR-triggered deploy. ref_name covers a manual dispatch, where
      # there is no triggering run.
      BUILT_BRANCH: ${{ github.event.workflow_run.head_branch || github.ref_name }}
      DEFAULT: ${{ github.event.repository.default_branch }}
      SEED_TAG: pages-default-seed
    steps:
      # The CONSUMER's repo, at the root cwd: assemble.mjs runs `git tag` here to order
      # that repo's deployed versions. It needs the TAGS, not the history — and this
      # runs on every deploy of every consumer, some with years of commits, so ask for
      # exactly that rather than `fetch-depth: 0`. (docs.yml deliberately still clones
      # in full: a build-command may run `git describe`.)
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
          fetch-tags: true

      # THIS reusable workflow's repo + commit (the `job` context resolves to the
      # reusable file, not the caller), so assemble.mjs matches the ref the consumer
      # pinned publish-gh-pages.yml@<ref> to — automatically, no version bump.
      # Sparse: only assemble/ is needed.
      #
      # `.mvs` is a RESERVED path in the consumer's workspace (documented as such in
      # docs/reference/workflows.md): the checkout lands inside their tree, so a repo
      # that has its own `.mvs/` would collide.
      - name: Fetch assemble.mjs
        uses: actions/checkout@v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .mvs
          sparse-checkout: assemble

      # Fork opt-in: pin the PR's head commit as approved. assemble gathers an external
      # PR only when its head SHA carries this status, so a later push (new SHA) silently
      # drops the preview until re-approved. Gated on `pr` alone, which the caller
      # threads in from its workflow_dispatch input.
      - name: Approve fork PR head SHA
        id: approve
        if: inputs.pr != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ inputs.pr }}
        run: |
          set -euo pipefail
          sha=$(gh pr view "$PR" --repo "$REPO" --json headRefOid -q .headRefOid)
          gh api --method POST "repos/$REPO/statuses/$sha" \
            -f state=success -f context=preview-approved \
            -f description="Fork docs preview approved"
          # Reused below to link the published preview back to this same commit.
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      # BUILT_BRANCH vs github.ref is the thing a post-mortem here always trips over, so
      # state both up front rather than leaving someone to infer it from a cache miss.
      #
      # Every context value comes through `env:`, never interpolated into the script.
      # That keeps arbitrary values out of the shell, and it avoids nesting quotes: an
      # expression's string literals must be SINGLE-quoted, which cannot be written
      # inside a single-quoted shell word.
      - name: Create staging dirs
        env:
          EVENT: ${{ github.event_name }}
          GH_REF: ${{ github.ref }}
          GH_SHA: ${{ github.sha }}
          TRIGGER_URL: ${{ github.event.workflow_run.html_url }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/site" "$RUNNER_TEMP/gather"
          printf '%-16s %s\n' \
            'event'         "$EVENT" \
            'built branch'  "$BUILT_BRANCH" \
            'default'       "$DEFAULT" \
            'github.ref'    "$GH_REF (always the default branch under workflow_run)" \
            'github.sha'    "$GH_SHA (→ pages_build_version)" \
            'triggered by'  "${TRIGGER_URL:-manual dispatch}"

      # The live Pages base URL, from the Pages API — respects a custom domain (CNAME);
      # falls back to the conventional github.io URL if the API call fails. Baked into
      # switcher.json's entry URLs.
      - name: Resolve the Pages URL
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          url=$(gh api "repos/$REPO/pages" -q .html_url 2>/dev/null || true)
          if [ -z "$url" ]; then
            owner=$(printf '%s' "${REPO%%/*}" | tr '[:upper:]' '[:lower:]')
            url="https://$owner.github.io/${REPO#*/}"
          fi
          echo "PAGES_URL=${url%/}" >> "$GITHUB_ENV"
          echo "Pages URL: ${url%/}"

      # ── Which releases, and which of their zips do we already have? ─────────
      #
      # Selection is assemble.mjs's job (pure, unit-tested); this step only does IO.
      # It runs BEFORE any download so the gather fetches only what will actually be
      # published. It writes the decision TSV to --out and prints the cache key for
      # that exact selection on stdout — the key is derived from the selection, so it
      # is derived where the selection is made.
      #
      # Cached zips are named by ASSET ID, not by tag: an asset id identifies its bytes
      # unambiguously, so a re-cut release can never be served from a stale cache entry.
      - name: Select releases to publish
        id: releases
        env:
          GH_TOKEN: ${{ github.token }}
          MAX_RELEASES: ${{ inputs.max-releases }}
        run: |
          set -euo pipefail
          gh api --paginate "repos/$REPO/releases" | jq -rs 'add // []' > "$RUNNER_TEMP/releases.json"
          key=$(node "$GITHUB_WORKSPACE/.mvs/assemble/assemble.mjs" select-releases \
            --default-branch "$DEFAULT" --seed-tag "$SEED_TAG" \
            --max-releases "${MAX_RELEASES:-0}" \
            --out "$RUNNER_TEMP/releases.tsv" \
            < "$RUNNER_TEMP/releases.json")
          echo "cache-key=$key" >> "$GITHUB_OUTPUT"
          # The bare namespace, for restore-keys: a prefix match returns the previous
          # selection, which shares every zip but the newly cut one.
          echo "cache-prefix=${key%-*}-" >> "$GITHUB_OUTPUT"

      - name: Restore cached release zips
        id: relcache
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/relcache
          key: ${{ steps.releases.outputs.cache-key }}
          restore-keys: ${{ steps.releases.outputs.cache-prefix }}

      # Releases are permanent sources; the seed release (if present) stands in for the
      # default branch until the durable copy is established — store it as $DEFAULT.zip
      # so the priority-overwrite chain below can supersede it with a fresher source.
      #
      # Prints a decision for every release the API listed, so a version missing from
      # the site can be explained from this log alone. Downloads are serial: the cache
      # above makes the steady state 0 or 1 of them, and a cold cache is a rare,
      # off-critical-path event that max-releases already bounds.
      - name: Gather release artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          relcache="$RUNNER_TEMP/relcache"; mkdir -p "$relcache"
          warnings="$RUNNER_TEMP/relcache-warnings"; : > "$warnings"
          hits=0; downloads=0

          # Warnings are buffered to after the table rather than printed mid-loop, so
          # the decision table stays readable.
          printf '%-28s %-21s %-9s %s\n' TAG CREATED SIZE DECISION
          # NB tab is IFS whitespace, so `read` COLLAPSES consecutive tabs — an empty
          # field would shift every column after it. assemble.mjs emits "-", never "".
          while IFS=$'\t' read -r tag dest created size assetid decision; do
            [ -n "$tag" ] || continue
            if [ "$dest" != "-" ]; then
              if [ -s "$relcache/$assetid.zip" ]; then
                hits=$((hits + 1))
                decision="$decision (cache hit)"
              # Fetch by ASSET ID, not `gh release download <tag> -p docs.zip`, so the
              # bytes match the id they are cached under. The cache is id-addressed
              # precisely because an id names immutable bytes — but a re-cut release
              # between the listing above and this download would have handed the NEW
              # docs.zip to the OLD id, cached for every later deploy to trust.
              elif gh api "repos/$REPO/releases/assets/$assetid" \
                     -H 'Accept: application/octet-stream' \
                     > "$relcache/$assetid.zip" 2>"$RUNNER_TEMP/relcache-download.err" \
                   && [ -s "$relcache/$assetid.zip" ] \
                   && [ "$(head -c 2 "$relcache/$assetid.zip")" = PK ]; then
                downloads=$((downloads + 1))
                decision="$decision (downloaded)"
              else
                # Leave nothing behind for the next run's cache to trust: a redirect to
                # a file means a FAILED request still wrote an error body, so the exit
                # status alone is not enough — hence the zip magic check above.
                rm -f "$relcache/$assetid.zip"
                decision="$decision (DOWNLOAD FAILED — skipped)"
                echo "::warning::release $tag: docs.zip (asset $assetid) download failed — skipping. $(head -1 "$RUNNER_TEMP/relcache-download.err" 2>/dev/null)" >> "$warnings"
              fi
              if [ -s "$relcache/$assetid.zip" ]; then
                cp "$relcache/$assetid.zip" "$RUNNER_TEMP/gather/$dest.zip"
              fi
            fi
            printf '%-28s %-21s %-9s %s\n' "$tag" "$created" "$size" "$decision"
          done < "$RUNNER_TEMP/releases.tsv"
          echo "release zips: $hits cached, $downloads downloaded"
          cat "$warnings"

          # Prune anything no longer selected, so a capped cache stays capped.
          keep=$(awk -F'\t' '$2 != "-" {print $5 ".zip"}' "$RUNNER_TEMP/releases.tsv" | sort -u)
          for f in "$relcache"/*.zip; do
            [ -f "$f" ] || continue
            grep -qxF "$(basename "$f")" <<<"$keep" || rm -f "$f"
          done

      # Save only when the DEFAULT BRANCH was what got built. Entries are scoped to the
      # writing ref, and a deploy dispatched from some other ref would write one only that
      # ref can read — invisible to every ordinary deploy, and dead weight against the
      # 10 GB quota. Test the BUILT branch, not github.ref, which under workflow_run is
      # the default branch even for a PR-triggered deploy (so a workflow_run save is
      # always default-branch-scoped, whatever triggered it). Skipped on an exact key
      # hit: cache entries are immutable, so it is already there.
      - name: Save release zips to the cache
        if: >-
          (github.event.workflow_run.head_branch || github.ref_name) == github.event.repository.default_branch &&
          steps.relcache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/relcache
          key: ${{ steps.releases.outputs.cache-key }}

      # Branch CI artifacts overwrite the seed (higher priority). Found via the
      # artifacts API by NAME (`docs` — the contract), never by workflow filename, so the
      # consumer's entry workflow can be called anything. An artifact's workflow_run
      # carries head_branch/head_sha/head_repository_id but no run conclusion — existence
      # is the signal, since docs.yml only uploads after a successful build.
      #
      # This step is IO only: paginate the artifacts API ONCE (re-paginating it per open
      # PR costs minutes on a busy repo), resolve each fork PR's approval, then hand both
      # lists to assemble.mjs, which decides what lands where. Unlike the release zips
      # these artifacts cannot be cached — a PR's head SHA changes on every push — so
      # every deploy pays 1 + open-PR downloads, and those run in parallel.
      - name: Gather branch CI artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          MAX_PRS: ${{ inputs.max-prs }}
        run: |
          set -euo pipefail
          repo_id=$(gh api "repos/$REPO" -q .id)
          gh api --paginate "repos/$REPO/actions/artifacts?name=docs&per_page=100" \
            | jq -rs '[.[].artifacts[]]' > "$RUNNER_TEMP/artifacts.json"

          # Fork approval is an API call per cross-repo PR, so settle it here and pass
          # the answer in — assemble.mjs stays free of network IO.
          prs="$RUNNER_TEMP/prs.tsv"; : > "$prs"
          pr_limit=200
          while IFS=$'\t' read -r num sha cross; do
            [ -n "$num" ] || continue
            approved=true
            if [ "$cross" = "true" ]; then
              approved=$(gh api "repos/$REPO/commits/$sha/statuses" \
                -q 'any(.[]; .context=="preview-approved" and .state=="success")')
            fi
            printf '%s\t%s\t%s\n' "$num" "$sha" "$approved" >> "$prs"
          done < <(gh pr list --repo "$REPO" --state open --limit "$pr_limit" \
            --json number,headRefOid,isCrossRepository \
            -q '.[] | [.number, .headRefOid, .isCrossRepository] | @tsv')
          # A truncated listing is otherwise indistinguishable from a repo that happens
          # to have exactly $pr_limit open PRs: the missing ones simply get no preview,
          # with nothing in the log to explain it.
          if [ "$(wc -l < "$prs")" -ge "$pr_limit" ]; then
            echo "::warning::more than $pr_limit open PRs — only the first $pr_limit were \
          considered for previews, so some open PRs will have none. max-prs caps how many \
          are published; this caps how many are even looked at."
          fi


          # The API serves an artifact as a zip-of-the-artifact, with docs.zip inside.
          # Two failure modes are reported distinctly because they need different fixes:
          # a download failure (transient), and no docs.zip inside — which has two very
          # different causes, so the warning names both.
          # assemble.mjs decides; this pipeline only fetches. It prints three
          # NUL-separated fields per artifact, which xargs hands to the worker as
          # POSITIONAL ARGS — never -I{}, which pastes the row into the script TEXT where
          # a label containing $(...) would be executed rather than printed. -r so an
          # empty selection runs nothing.
          #
          # `gather-artifact` after the script is the worker's $0: `bash -c` takes the
          # arg AFTER the script as $0, so without something there the first field would
          # land in $0 and every other shift by one. bash prefixes its errors with $0, so
          # naming it makes a failing worker identify itself in the log.
          export REPO
          export gather_dir="$RUNNER_TEMP/gather"
          # shellcheck disable=SC2016
          node "$GITHUB_WORKSPACE/.mvs/assemble/assemble.mjs" select-artifacts \
            --default-branch "$DEFAULT" --repo-id "$repo_id" \
            --prs "$prs" --max-prs "${MAX_PRS:-0}" \
            --repo "$REPO" --server-url "$GITHUB_SERVER_URL" \
            < "$RUNNER_TEMP/artifacts.json" \
            | xargs -0 -r -P 8 -n 3 bash -c '
            set -uo pipefail
            dest=$1 id=$2 label=$3
            tmp=$(mktemp -d)
            if ! gh api "repos/$REPO/actions/artifacts/$id/zip" > "$tmp/artifact.zip" 2>/dev/null; then
              echo "::warning::$label: artifact $id download failed — skipping"
            elif ! unzip -q "$tmp/artifact.zip" docs.zip -d "$tmp" >/dev/null 2>&1 || [ ! -f "$tmp/docs.zip" ]; then
              # The FILE test, not the exit status: unzip exits 0 with only a
              # "caution: filename not matched" note when the member is absent.
              echo "::warning::$label: artifact $id has no docs.zip inside — skipping. Either it was built before docs.yml packed docs.zip (re-run that build to refresh it), or another workflow in this repo uploads an unrelated artifact also named docs (rename it — the artifact NAME is how versions are found)."
            else
              mv "$tmp/docs.zip" "$gather_dir/$dest.zip"
            fi
            rm -rf "$tmp"
          ' gather-artifact

      # The default branch's last known-good docs.zip. Releases are durable and PRs are
      # ephemeral by design, but the DEFAULT BRANCH has no permanent source: it is
      # gathered from its latest CI artifact, which expires, after which it would drop
      # out and the guard below would hard-fail. The Actions cache holds a copy instead
      # — evicted after 7 days without a read and by LRU past 10 GB, so a repo quiet for
      # over a week AND whose CI artifact has expired loses the rung and fails loudly.
      #
      # Key is a bare prefix so it never matches exactly; restore-keys then supplies the
      # most recent entry.
      - name: Restore the default branch's durable docs.zip
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/defaultcache
          key: mvs-default-v1-
          restore-keys: mvs-default-v1-

      # Fallback chain for $DEFAULT.zip: release/seed → branch CI (both above) → the
      # cache. Hard-fail if none of them produced it: a deploy missing the default
      # branch publishes a hole.
      - name: Ensure default-branch zip
        id: ensure-default
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cache="$RUNNER_TEMP/defaultcache"; mkdir -p "$cache"
          zip="$RUNNER_TEMP/gather/$DEFAULT.zip"
          if [ -f "$zip" ]; then
            echo "$DEFAULT supplied by an earlier rung ($(stat -c%s "$zip") B)"
          elif [ -s "$cache/default.zip" ]; then
            cp "$cache/default.zip" "$zip"
            echo "::notice::$DEFAULT restored from the Actions cache ($(stat -c%s "$zip") B) \
          — its CI artifact has expired, so this deploy is serving the last cached build"
          else
            echo "::error::$DEFAULT: not provided by releases, branch CI or the Actions \
          cache — deploy aborted"
            exit 1
          fi
          # Re-save only when the bytes actually changed: cache entries are immutable, so
          # a content-addressed key means an unchanged default branch adds no entry.
          new=$(sha256sum "$zip" | cut -c1-32)
          old=$(cat "$cache/default.sha" 2>/dev/null || true)
          if [ "$new" != "$old" ]; then
            cp "$zip" "$cache/default.zip"
            printf '%s' "$new" > "$cache/default.sha"
            echo "cache-key=mvs-default-v1-$new" >> "$GITHUB_OUTPUT"
          fi

      # Same rule and the same trap as the release-zip cache above. Also gated on the
      # content hash having changed, so an unchanged default branch adds no entry.
      - name: Save the default branch's durable docs.zip
        if: >-
          steps.ensure-default.outputs.cache-key != '' &&
          (github.event.workflow_run.head_branch || github.ref_name) == github.event.repository.default_branch
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/defaultcache
          key: ${{ steps.ensure-default.outputs.cache-key }}

      # Unzip every gathered zip into SITE/<version-name>.
      #
      # THE ZIP-SHAPE CONTRACT: a docs.zip must unzip to exactly ONE top-level
      # directory, whose CONTENTS become site/<version-name>. The directory's NAME is
      # ignored, because release assets are durable and may have been packed by another
      # pipeline — python-copier-template's `_release.yml` roots its zip at the TAG NAME,
      # and an immutable release cannot be re-cut. Anything else — no entries, several
      # entries, or files loose at the zip root — is malformed and warns + skips rather
      # than guessing.
      - name: Extract artifacts into site
        run: |
          set -euo pipefail
          for f in "$RUNNER_TEMP/gather"/*.zip; do
            [ -f "$f" ] || continue
            name=$(basename "$f" .zip)
            tmp=$(mktemp -d)
            if ! unzip -q "$f" -d "$tmp" 2>/dev/null; then
              echo "::warning::$name: could not unzip docs.zip — skipping"
              rm -rf "$tmp"; continue
            fi
            # -print0/-d '' so the count is exact whatever the entries are named,
            # and dotfiles at the root count too (they would be a malformed zip).
            roots=(); mapfile -d '' -t roots < <(find "$tmp" -mindepth 1 -maxdepth 1 -print0)
            if [ "${#roots[@]}" -eq 1 ] && [ -d "${roots[0]}" ]; then
              rm -rf "$RUNNER_TEMP/site/$name"
              mv "${roots[0]}" "$RUNNER_TEMP/site/$name"
            else
              found=$(printf '%s ' "${roots[@]##*/}")
              echo "::warning::$name: docs.zip must unzip to exactly one top-level directory — found [${found% }] — skipping"
            fi
            rm -rf "$tmp"
          done

      # `generate` orders versions, writes switcher.json + index.html, and prints the
      # stable-alias source dir (the newest release), or "" when no release is deployed yet.
      # Hard-fails if the default branch is absent (Ensure step guarantees the zip, but
      # the extract could still fail if the zip was malformed). The last thing to touch
      # the tree, so it also stamps the deploy and reports the final size.
      - name: Generate switcher.json and stable alias
        run: |
          set -euo pipefail
          stable_src=$(node "$GITHUB_WORKSPACE/.mvs/assemble/assemble.mjs" generate \
            --site-dir "$RUNNER_TEMP/site" --base-url "$PAGES_URL" \
            --default-branch "$DEFAULT" --required "$DEFAULT")
          # An `&& ln … || true` one-liner here would also swallow a FAILED symlink, not
          # just the empty-stable_src case — and a missing stable/ alias is silent damage.
          if [ -n "$stable_src" ]; then
            ln -s "$stable_src" "$RUNNER_TEMP/site/stable"
          fi

          # The deploy stamp the verify step below polls for. It has to change on EVERY
          # deploy, which switcher.json does not: that file lists the version set, so an
          # ordinary docs edit on the default branch reproduces it byte-for-byte and a
          # stale origin would compare equal. run + attempt + the clock are unique per
          # deploy by construction. GITHUB_RUN_* are default runner env vars, so this
          # needs no expression.
          #
          # Safe at the site root: assemble.mjs's discoverVersions returns DIRECTORIES
          # only, so a file here is never mistaken for a version.
          printf 'run=%s\nattempt=%s\nutc=%s\n' \
            "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            > "$RUNNER_TEMP/site/deploy-id.txt"

          # The size that actually gets uploaded: -L follows stable/, which
          # upload-pages-artifact materialises as a full COPY of the newest release
          # (it tars with --dereference). Reported after the alias exists, because a
          # number that omits the largest single version is worse than no number on a
          # metric whose whole job is to warn before the 1 GB cap. The cap applies to
          # the compressed upload and HTML/JS packs around 3x, so this reads high.
          echo "assembled site: $(du -shL "$RUNNER_TEMP/site" | cut -f1) on disk across \
          $(find "$RUNNER_TEMP/site" -mindepth 1 -maxdepth 1 -type d | wc -l) version dir(s)"
          if [ -n "$stable_src" ]; then
            echo "  ...of which stable/ is a second copy of $stable_src \
          ($(du -shL "$RUNNER_TEMP/site/stable" | cut -f1)) — see docs/how-to/keep-the-site-small.md"
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ runner.temp }}/site

      # deploy-pages stamps the deployment with pages_build_version = GITHUB_SHA and has
      # no input to change it; the value is server-validated against the OIDC commit
      # claim, so a custom one 404s (actions/deploy-pages#383). Under this workflow's
      # triggers a repeat SHA still re-serves — see the header.
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      # deploy-pages reports success once the deployment RECORD flips active, even if the
      # Pages backend fails to update the SERVED origin — a wedged site can serve a stale
      # artifact indefinitely while every deploy reports OK. This turns that into a red
      # check instead of silently serving old docs, polling up to ~6 min because a
      # re-serve can take minutes to reach the origin. The loop exits the instant both
      # files match, so a fast deploy isn't slowed. On failure, dump the origin headers
      # (a frozen etag/last-modified is the wedge signature).
      #
      # TWO files, and deploy-id.txt is the one that does the work. switcher.json only
      # changes when the VERSION SET changes, so on the commonest deploy of all — a docs
      # edit on the default branch — it is byte-identical to what is already served and
      # compares equal on attempt 1 whether or not the origin moved. That is precisely
      # the case where a wedge goes unnoticed. The stamp is unique per deploy, so it can
      # only match if these bytes are the ones being served. switcher.json stays as the
      # secondary check: it is the file the widget actually reads, so a mismatch there
      # means a partially-served deploy even when the stamp is current.
      - name: Verify the deployed origin matches what we assembled
        id: verify
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          SITE_DIR: ${{ runner.temp }}/site
        run: |
          set -euo pipefail
          [ -n "$PAGE_URL" ] || { echo "::error::deploy-pages did not report a page_url"; exit 1; }
          local_json="$SITE_DIR/switcher.json"
          local_id="$SITE_DIR/deploy-id.txt"
          for f in "$local_json" "$local_id"; do
            [ -f "$f" ] || { echo "::error::nothing to verify against: no $f"; exit 1; }
          done
          # Command substitution strips trailing newlines from both sides, so the
          # comparisons are robust to a curl/file trailing-newline difference.
          want_json=$(cat "$local_json")
          want_id=$(cat "$local_id")
          base="${PAGE_URL%/}"
          timeout_s=360
          deadline=$(( $(date +%s) + timeout_s ))
          attempt=0
          while :; do
            attempt=$((attempt + 1))
            # cache-bust → hit the origin, not a CDN copy
            cb=$(date +%s%N)
            got_id=$(curl -fsS "$base/deploy-id.txt?cb=$cb" || true)
            got_json=$(curl -fsS "$base/switcher.json?cb=$cb" || true)
            if [ "$got_id" = "$want_id" ] && [ "$got_json" = "$want_json" ]; then
              echo "origin is serving this deploy (attempt $attempt)"
              exit 0
            fi
            if [ "$(date +%s)" -ge "$deadline" ]; then
              stale="deploy-id.txt"
              [ "$got_id" = "$want_id" ] && stale="switcher.json"
              echo "::error::live $stale still does not match the assembled one after ${timeout_s}s — Pages origin likely stale/wedged"
              echo "--- origin headers (frozen etag/last-modified ⇒ wedged) ---"
              curl -sI "$base/deploy-id.txt?cb=$(date +%s%N)" | grep -iE '^(HTTP/|etag|last-modified|age)' | tr -d '\r'
              echo "--- assembled deploy-id ---"; printf '%s\n' "$want_id"
              echo "--- live deploy-id ---";      printf '%s\n' "$got_id"
              echo "--- assembled switcher.json ---"; printf '%s\n' "$want_json"
              echo "--- live switcher.json ---";      printf '%s\n' "$got_json"
              exit 1
            fi
            sleep 5
          done

      # Link the published docs from the commit that produced them, so a PR carries a
      # preview URL without carrying the deploy's failure modes.
      #
      # Deliberately success()-only and state=success only. Publishing moved off the PR's
      # critical path precisely because a wedged Pages origin is not the author's to fix;
      # a status that could go red would put that right back. A missing status means "not
      # published (yet)", which is the honest signal and costs the author nothing.
      #
      # Fails closed: if the version dir is not in the tree we just deployed — a fork PR
      # whose number we cannot resolve, a payload without `pull_requests` — say so and
      # post nothing, rather than publish a link that 404s.
      - name: Link the published docs from the triggering commit
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          PR_INPUT: ${{ inputs.pr }}
          APPROVED_SHA: ${{ steps.approve.outputs.sha }}
          TRIGGER_EVENT: ${{ github.event.workflow_run.event }}
          TRIGGER_SHA: ${{ github.event.workflow_run.head_sha }}
          TRIGGER_PR: ${{ github.event.workflow_run.pull_requests[0].number }}
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          if [ -n "${APPROVED_SHA:-}" ]; then
            # Fork preview: the maintainer named the PR, and we pinned its head SHA.
            sha="$APPROVED_SHA"; dest="pr-$PR_INPUT"
          elif [ "${TRIGGER_EVENT:-}" = pull_request ] && [ -n "${TRIGGER_PR:-}" ]; then
            sha="$TRIGGER_SHA"; dest="pr-$TRIGGER_PR"
          elif [ -n "${TRIGGER_SHA:-}" ]; then
            # A branch or tag build: BUILT_BRANCH is the version name it was served at.
            sha="$TRIGGER_SHA"; dest="$BUILT_BRANCH"
          else
            echo "manual re-deploy — no triggering commit to link"; exit 0
          fi
          if [ ! -d "$RUNNER_TEMP/site/$dest" ]; then
            echo "::notice::no $dest/ in the deployed site — not linking ${sha:0:8}"
            exit 0
          fi
          url="${PAGE_URL%/}/$dest/"
          gh api --method POST "repos/$REPO/statuses/$sha" \
            -f state=success -f context=docs-preview \
            -f target_url="$url" -f description="Docs published at $dest/"
          echo "linked ${sha:0:8} → $url"
