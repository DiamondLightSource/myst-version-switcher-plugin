on:
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Unit tests (widget logic + make-switcher parity)
        run: npm test

      # publish.yml's gather steps are the most intricate code in the repo, and a real
      # deploy is the only other way to exercise them. The harness loads them out of the
      # YAML and runs them against a mock gh, so the tests cannot drift from the workflow.
      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0   # full version: setup-uv uses immutable releases
        with:
          enable-cache: false
      - name: Workflow gather-step tests
        run: npm run test:workflows
      # release.yml downloads every artifact in the run and attaches them, so name this
      # explicitly (not the default "artifact") and fail loudly if the plugin is missing
      # — it's a release asset.
      - name: Upload version switcher artifact
        uses: actions/upload-artifact@v7
        with:
          name: version-switcher
          path: plugins/version-switcher.mjs
          if-no-files-found: error
