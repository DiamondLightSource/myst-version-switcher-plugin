name: Publish

# The one file each consuming repo carries, and the single place they pin <tag>. It does
# nothing but call the engine (publish-gh-pages.yml) when CI finishes. This repo's copy is
# IDENTICAL to a consumer's but for the `uses:` path — theirs pins
# DiamondLightSource/myst-version-switcher-plugin/.github/workflows/publish-gh-pages.yml@<tag>,
# this one uses the local file, so what deploys is main's tree rather than a pinned
# release tag.
#
# Note what that does NOT mean. Under `workflow_run` GitHub always runs the DEFAULT
# BRANCH's copy of this file, and `uses: ./…` resolves against that same commit — so a
# PR that changes publish-gh-pages.yml or assemble.mjs is never exercised by a real
# deploy before it merges. Engine changes are covered by test/workflow-harness/, which
# loads the steps out of the YAML and runs them; there is no way to make workflow_run
# run a PR's version of a workflow.
#
# Publishing lives here rather than as a job in ci.yml because it is O(the whole site) and
# independent of the change, so nesting it put a large constant on every PR's critical
# path; and because a wedged Pages origin is not the PR author's to fix, so its red check
# was noise on their PR.
on:
  # `workflows:` matches the entry workflow by its `name:`, NOT its filename — if you
  # rename your CI workflow, change it here too or publishing silently stops.
  workflow_run:
    workflows: [CI]
    types: [completed]

  # Fork-PR previews (`pr`) and manual re-deploys. A maintainer runs this to publish a
  # preview for an external contributor, which is the only way a fork's build reaches the
  # site — see the guard below.
  workflow_dispatch:
    inputs:
      pr:
        description: "Fork PR to approve + preview (empty = plain re-deploy)"
        required: false
        default: ""

jobs:
  publish:
    # Three guards, all load-bearing:
    #
    #   conclusion == 'success' — a failed CI run has no usable docs artifact, and
    #   workflow_run fires on failures too.
    #
    #   head_repository == this repo — workflow_run runs with a WRITE token even when the
    #   triggering run came from a fork's pull request. Deploying a fork's build
    #   automatically would hand untrusted content a privileged path to the live site
    #   (the classic pwn-request shape). Fork builds reach the site only when a maintainer
    #   dispatches this workflow with `pr`, which records an approval against that exact
    #   head SHA — so a later push to the PR drops the preview until re-approved.
    #
    #   event != 'merge_group' — a merge-queue CI run's docs.yml build is never uploaded
    #   (its version name is the fixed "merge-queue" literal, and the gather never looks
    #   for it), so gathering here would only reassemble and redeploy a site that changes
    #   nothing — once per queue entry, on top of the deploy the subsequent push to the
    #   base branch already triggers.
    #
    # A manual dispatch has no `workflow_run` payload, so all three terms are empty and the
    # first clause carries it. Removing any of the three guards fails OPEN.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_repository.full_name == github.repository &&
       github.event.workflow_run.event != 'merge_group')
    uses: ./.github/workflows/publish-gh-pages.yml
    with:
      # Set (dispatch only) → approve and preview that fork PR's head SHA.
      pr: ${{ inputs.pr }}
      # The site deploys as ONE Pages artifact against a hard 1 GB cap, and every release
      # and open PR is a full copy of the docs. These cap what gets published; 0 = no
      # limit. Both are LITERALS because this is site-size policy and must hold on every
      # path — this workflow is the engine's single caller, so a literal here cannot be
      # bypassed by a manual dispatch. See docs/how-to/keep-the-site-small.md.
      max-releases: "30"
      max-prs: "20"
    permissions:
      contents: read
      actions: read      # gather cross-run docs artifacts
      pages: write
      id-token: write
      statuses: write    # record the fork-preview approval on a head SHA
