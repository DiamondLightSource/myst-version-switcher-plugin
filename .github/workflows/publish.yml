name: Publish

# The one file each consuming repo carries, and the single place they pin <tag>. It does
# nothing but call the engine (publish-gh-pages.yml) when CI finishes.
#
# This repo's copy is IDENTICAL to a consumer's but for the `uses:` path — theirs pins
# DiamondLightSource/myst-version-switcher-plugin/.github/workflows/publish-gh-pages.yml@<tag>,
# this one uses the local file so the working tree is what gets tested.
#
# WHY workflow_run rather than a job in ci.yml. Publishing is O(the whole site) — it
# reconstructs every version on every run — so nesting it in CI put a constant, sizeable
# cost inside every PR's critical path, which is exactly why the first consumer switched
# PR previews off a day after adopting. On workflow_run it runs after CI, on its own time,
# and a failed deploy no longer shows up as a red check against an author who has no
# control over the Pages infrastructure.
#
# It also DELETED machinery rather than adding any: because workflow_run fires once the
# triggering run has COMPLETED, that run's `docs` artifact is discoverable by the ordinary
# gather, so there is no in-run artifact to inject; and because a tag's deploy re-serves
# on this event (see the engine's header), there is no trampoline and so no need for a
# separately dispatchable shim.
on:
  # `workflows:` matches the entry workflow by its `name:`, NOT its filename — if you
  # rename your CI workflow, change it here too or publishing silently stops.
  workflow_run:
    workflows: [CI]
    types: [completed]

  # Fork-PR previews (`pr`) and manual re-deploys. A maintainer runs this to publish a
  # preview for an external contributor, which is the only way a fork's build reaches the
  # site — see the guard below.
  workflow_dispatch:
    inputs:
      pr:
        description: "Fork PR to approve + preview (empty = plain re-deploy)"
        required: false
        default: ""

jobs:
  publish:
    # Two guards, both load-bearing:
    #
    #   conclusion == 'success' — a failed CI run has no usable docs artifact, and
    #   workflow_run fires on failures too.
    #
    #   head_repository == this repo — workflow_run runs with a WRITE token even when the
    #   triggering run came from a fork's pull request. Deploying a fork's build
    #   automatically would hand untrusted content a privileged path to the live site
    #   (the classic pwn-request shape). Fork builds reach the site only when a maintainer
    #   dispatches this workflow with `pr`, which records an approval against that exact
    #   head SHA — so a later push to the PR drops the preview until re-approved.
    #
    # A manual dispatch has no `workflow_run` payload, so both terms are empty and the
    # first clause carries it.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    uses: ./.github/workflows/publish-gh-pages.yml
    with:
      # Set (dispatch only) → approve and preview that fork PR's head SHA.
      pr: ${{ inputs.pr }}
      # Publish only the N most recent releases; 0 = all of them. A literal, because this
      # is site-size policy and must hold on every path. The site deploys as ONE Pages
      # artifact against a hard 1 GB cap — see docs/how-to/keep-the-site-small.md.
      #
      # This repo deliberately differs from the "20" the tutorial ships: our own site is
      # ~223 MB packed across 24 releases, a fifth of the cap, so capping would drop old
      # versions for no gain. The capped path is covered by the unit tests and the
      # workflow harness instead.
      max-releases: "0"
    permissions:
      contents: read
      actions: read      # gather cross-run docs artifacts
      pages: write
      id-token: write
      statuses: write    # record the fork-preview approval on a head SHA
