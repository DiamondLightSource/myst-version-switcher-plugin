name: Publish

# Reconstruct the WHOLE versioned docs site from durable sources (the consumer's
# default-branch build, release docs.zip assets, open-PR build artifacts) and deploy it
# directly to GitHub Pages — no gh-pages branch. The PRIVILEGED half. Its only caller is
# a thin `publish-dispatch.yml` shim (this repo's own, or a consumer's pinned at <tag>)
# which exposes it as both `workflow_call` (ci.yml's `publish` job, for every event) and
# `workflow_dispatch` (the tag re-dispatch + fork-PR opt-in + manual re-deploy).
# This workflow OWNS the event branching, into one of three jobs:
#
#   deploy      — internal PR / default-branch push / any workflow_dispatch → assemble +
#                  deploy + verify. The inline path injects the in-run build via
#                  `version-name`; the dispatch paths pure-gather (version-name "").
#   re-dispatch  — a TAG push. An inline tag deploy is silently DROPPED by Pages (it reuses
#                  the default branch's just-deployed SHA on a non-dispatch event —
#                  deploy-pages#383), so wait for the tag's docs.zip ASSET (not merely
#                  its release record — see the job), then re-fire the shim
#                  (`inputs.dispatch-workflow`, a file in the CONSUMER's repo — a
#                  workflow_call run executes with the caller's repo + token, so we can
#                  dispatch it) → the deploy lands on a `workflow_dispatch` event and
#                  re-serves. A reusable workflow can't be dispatched cross-repo, which is
#                  why the shim (not this engine) is the dispatch target.
#   warn         — a FORK PR. Read-only token, never deploys; just surfaces the opt-in hint.
#
# The assemble logic is THIS repo's assemble.mjs (the pure kernel); the IO plumbing
# lives as inline steps in this file. To version-match assemble.mjs to this workflow,
# we check out the reusable workflow's OWN repo at its OWN commit via the `job` context:
# unlike github.workflow_* (which resolve to the CALLER's entry workflow),
# `job.workflow_repository` + `job.workflow_sha` resolve to the file that defines THIS
# job — i.e. the reusable workflow at the ref a consumer pinned `publish.yml@<ref>` to.
# So assemble.mjs always matches the workflow version, with no hardcoded repo and no
# manual release-time bump. assemble.mjs runs `git tag` in the cwd, so the CONSUMER's
# repo is checked out at the root (with tags) to supply their version list; assemble.mjs
# comes from .mvs.
on:
  workflow_call:
    inputs:
      version-name:
        description: Version name (pr-<n> | <default-branch> | <tag>) of the in-run build to inject; "" → pure durable gather.
        required: false
        default: ""
        type: string
      pr:
        description: External fork PR number to approve (pins its head SHA) and preview.
        required: false
        default: ""
        type: string
      dispatch-workflow:
        description: >-
          Filename of the publish-dispatch shim in the consumer's repo, re-fired by
          the tag re-dispatch. Defaults to the conventional name; override if you renamed it.
        required: false
        default: publish-dispatch.yml
        type: string
      retry-until:
        description: >-
          Internal — epoch-seconds deadline for auto-retrying a wedged Pages origin.
          Empty means no retry budget (set only by the tag re-dispatch job, from the
          release's publish time); carried unchanged through any retries. Don't set manually.
        required: false
        default: ""
        type: string

jobs:
  # Fork PR: read-only token, never deploys — surface the manual-opt-in hint on the PR.
  warn:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Explain the fork-preview opt-in
        run: |
          echo "::warning title=Docs preview not published::This is a fork PR, so the \
          versioned docs site is NOT auto-published (fork builds run with a read-only \
          token). A maintainer can publish a preview by running the \
          ${{ inputs.dispatch-workflow }} workflow for PR #${{ github.event.pull_request.number }}: \
          https://github.com/${{ github.repository }}/actions/workflows/${{ inputs.dispatch-workflow }}"

  # Internal PR / default-branch push (inline), or any workflow_dispatch → deploy.
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref_type != 'tag') ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    permissions:
      contents: read     # checkout + read release assets
      actions: write     # gather cross-run docs artifacts (read) + retry-dispatch on a wedged origin (write)
      pages: write       # deploy to Pages
      id-token: write    # deploy-pages OIDC
      statuses: write    # set the preview-approved status on a fork PR head SHA
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    env:
      REPO: ${{ github.repository }}
      DEFAULT: ${{ github.event.repository.default_branch }}
      SEED_TAG: pages-default-seed
      SOURCES_DIR: _sources
    steps:
      # Everything a post-mortem needs, in one place, at the top of the log: which
      # event, which ref, which inputs, which assemble.mjs. Timestamped — the gather
      # below races a release's asset upload, and you cannot see a race without clocks.
      - name: Log deploy context
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          REF_TYPE: ${{ github.ref_type }}
          ACTOR: ${{ github.actor }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          KERNEL: ${{ job.workflow_repository }}@${{ job.workflow_sha }}
          IN_VERSION_NAME: ${{ inputs.version-name }}
          IN_PR: ${{ inputs.pr }}
          IN_RETRY_UNTIL: ${{ inputs.retry-until }}
          IN_DISPATCH_WF: ${{ inputs.dispatch-workflow }}
        run: |
          set -euo pipefail
          printf '%-26s %s\n' \
            'deploy started'            "$(date -u -Is)" \
            'repo'                      "$REPO" \
            'default branch'            "$DEFAULT" \
            'event'                     "$EVENT" \
            'ref'                       "$REF (${REF_TYPE:-branch})" \
            'actor'                     "$ACTOR" \
            'run'                       "$RUN_URL" \
            'assemble.mjs'              "$KERNEL" \
            'inputs.version-name'       "${IN_VERSION_NAME:-<empty> (pure durable gather)}" \
            'inputs.pr'                 "${IN_PR:-<empty>}" \
            'inputs.retry-until'        "${IN_RETRY_UNTIL:-<empty> (no auto-retry)}" \
            'inputs.dispatch-workflow'  "$IN_DISPATCH_WF"

      # The CONSUMER's repo, at the root cwd: assemble.mjs runs `git tag` here to
      # order that repo's deployed versions, so it needs their tags (fetch-depth: 0).
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # THIS reusable workflow's repo + commit (the `job` context resolves to the
      # reusable file, not the caller), so assemble.mjs matches the ref the consumer
      # pinned publish.yml@<ref> to — automatically, no version bump.
      # Sparse: only assemble/ is needed.
      - name: Fetch assemble.mjs
        uses: actions/checkout@v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .mvs
          sparse-checkout: assemble

      # Fork opt-in: pin the PR's head commit as approved. assemble gathers an external
      # PR only when its head SHA carries this status, so a later push (new SHA) silently
      # drops the preview until re-approved. Gated on `pr` alone, which the shim threads
      # in from its dispatch input.
      - name: Approve fork PR head SHA
        if: inputs.pr != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sha=$(gh pr view "${{ inputs.pr }}" --repo "$REPO" --json headRefOid -q .headRefOid)
          gh api --method POST "repos/$REPO/statuses/$sha" \
            -f state=success -f context=preview-approved \
            -f description="Fork docs preview approved"

      # provenance.tsv is the deploy's audit trail: every gather step appends
      # "<version>\t<source>\t<detail>", later lines superseding earlier ones for the
      # same version (that ordering IS the priority chain). The summary step renders
      # the last line per version as a table on the run page.
      - name: Create staging dirs
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/site" "$RUNNER_TEMP/gather"
          : > "$RUNNER_TEMP/provenance.tsv"

      # The live Pages base URL, from the Pages API — respects a custom domain
      # (CNAME); falls back to the conventional github.io URL if the API call
      # fails. Used by the _sources restore below and baked into switcher.json.
      - name: Resolve the Pages URL
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          url=$(gh api "repos/$REPO/pages" -q .html_url 2>/dev/null || true)
          src="Pages API (honours a custom domain)"
          if [ -z "$url" ]; then
            owner=$(printf '%s' "${REPO%%/*}" | tr '[:upper:]' '[:lower:]')
            url="https://$owner.github.io/${REPO#*/}"
            src="fallback — the Pages API call failed or Pages is not configured"
          fi
          echo "PAGES_URL=${url%/}" >> "$GITHUB_ENV"
          echo "Pages URL: ${url%/}  [$src]"

      # Releases are permanent sources; the seed release (if present) stands in for the
      # default branch until _sources/ is established — store it as $DEFAULT.zip so the
      # priority-overwrite chain below can supersede it with a fresher source.
      #
      # Prints a decision per release. A release is selected by its docs.zip ASSET, so
      # "published but no asset yet" silently drops that version from the deploy — the
      # exact race the re-dispatch job now waits out. A recent one gets a loud warning
      # here too, because this is the step whose log has to explain it.
      - name: Gather release artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          now=$(date +%s)
          releases=$(gh api --paginate "repos/$REPO/releases" | jq -rs 'add // []')
          echo "$(jq length <<<"$releases") release(s) listed at $(date -u -Is)"
          printf '%-28s %-21s %-9s %s\n' TAG PUBLISHED DOCS.ZIP DECISION
          while IFS=$'\t' read -r tag published has size; do
            [ -n "$tag" ] || continue
            dest=""; decision=""
            case "$tag" in
              */*)        decision="skip: '/' in tag (never built)" ;;
              "$DEFAULT") decision="skip: same name as the default branch" ;;
              "$SEED_TAG") dest="$DEFAULT" ;;
              *)          dest="$tag" ;;
            esac
            if [ -z "$decision" ] && [ "$has" != true ]; then
              decision="skip: no docs.zip asset"
              dest=""
              # Only a *recently* published one is the race; an old asset-less release
              # (a source-only tag) is normal. An unparseable date warns about nothing.
              pub_s=""
              if [ "$published" != "-" ]; then pub_s=$(date -d "$published" +%s 2>/dev/null || true); fi
              if [ -n "$pub_s" ] && [ "$(( now - pub_s ))" -lt 1800 ]; then
                echo "::warning::release $tag was published $(( (now - pub_s) / 60 ))m ago and still \
          has no docs.zip asset — it will be MISSING from this deploy. Its release job is \
          probably still uploading; see publish.yml's re-dispatch job, which waits for the \
          asset before dispatching a tag deploy."
              fi
            fi
            if [ -n "$dest" ]; then
              if gh release download "$tag" --repo "$REPO" -p docs.zip \
                   -O "$RUNNER_TEMP/gather/$dest.zip"; then
                decision="gathered → $dest.zip ($size B)"
                printf '%s\trelease\t%s (asset %s B)\n' "$dest" "$tag" "$size" \
                  >> "$RUNNER_TEMP/provenance.tsv"
              else
                decision="DOWNLOAD FAILED — skipped"
                echo "::warning::release $tag download failed — skipping"
              fi
            fi
            printf '%-28s %-21s %-9s %s\n' "$tag" "$published" "$has" "$decision"
          # NB tab is IFS whitespace, so `read` COLLAPSES consecutive tabs — an empty
          # field would shift every column after it. Never emit one: "-" for a null date.
          done < <(jq -r '.[] | [
              .tag_name,
              (.published_at // "-"),
              (any(.assets[]; .name=="docs.zip")),
              ([.assets[] | select(.name=="docs.zip") | .size] | first // 0)
            ] | @tsv' <<<"$releases")

      # Branch CI artifacts overwrite the seed (higher priority). Found via the
      # artifacts API by NAME (`docs` — the contract), never by workflow filename,
      # so the consumer's entry workflow can be called anything. An artifact's
      # workflow_run carries head_branch/head_sha/head_repository_id but no run
      # conclusion — existence is the signal (docs.yml only uploads after a
      # successful build). Default branch: newest non-expired docs artifact built
      # from THIS repo's code on that branch (head_repository_id keeps a same-named
      # fork branch out). PRs: keyed by head SHA — internal always; external forks
      # only when the SHA carries a preview-approved status. No
      # $ARTIFACT_VERSION_NAME skip — the current build (staged next) overwrites
      # anything gathered here with the same name.
      #
      # The three ways this can come up empty are logged DISTINCTLY, because they need
      # different fixes: no artifact (nothing built / it expired), a download failure
      # (transient), and an artifact with no docs.zip inside (built by a docs.yml older
      # than the docs.zip packing contract — re-run that PR's CI).
      - name: Gather branch CI artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          repo_id=$(gh api "repos/$REPO" -q .id)
          gather_artifact() {
            local filter="$1" dest="$2" label="$3"
            local meta; meta=$(gh api --paginate \
              "repos/$REPO/actions/artifacts?name=docs&per_page=100" \
              | jq -rs "[.[].artifacts[] | select((.expired | not) and ($filter))]
                  | sort_by(.created_at) | last
                  | select(. != null)
                  | [.id, .created_at, .size_in_bytes, .workflow_run.id, .workflow_run.head_sha] | @tsv")
            if [ -z "$meta" ]; then
              echo "  $label → no non-expired 'docs' artifact matches — skipping"
              return 0
            fi
            local id created size run sha
            IFS=$'\t' read -r id created size run sha <<<"$meta"
            echo "  $label → artifact $id ($size B, built $created) from \
          $GITHUB_SERVER_URL/$REPO/actions/runs/$run @ ${sha:0:8}"
            # The API serves the artifact as a zip-of-the-artifact (docs.zip inside).
            local tmp; tmp=$(mktemp -d)
            if ! gh api "repos/$REPO/actions/artifacts/$id/zip" > "$tmp/artifact.zip"; then
              echo "::warning::$label: artifact $id download failed — skipping"
            elif ! unzip -q "$tmp/artifact.zip" docs.zip -d "$tmp" >/dev/null 2>&1 \
                 || [ ! -f "$tmp/docs.zip" ]; then
              # The file test, NOT unzip's exit status, is the check: unzip exits 0 with
              # only a "caution: filename not matched" note when the member is absent.
              echo "::warning::$label: artifact $id contains no docs.zip — it predates the \
          docs.zip packing contract (docs.yml packs one now). Re-run that build to refresh \
          it. Skipping."
            else
              mv "$tmp/docs.zip" "$RUNNER_TEMP/gather/$dest.zip"
              printf '%s\tbranch CI\tartifact %s, run %s @ %s\n' "$dest" "$id" "$run" "${sha:0:8}" \
                >> "$RUNNER_TEMP/provenance.tsv"
            fi
            rm -rf "$tmp"
          }
          echo "default branch:"
          gather_artifact ".workflow_run.head_branch == \"$DEFAULT\" and .workflow_run.head_repository_id == $repo_id" \
            "$DEFAULT" "default-branch CI ($DEFAULT)"
          prs=$(gh pr list --repo "$REPO" --state open --limit 200 \
            --json number,headRefOid,isCrossRepository -q '.[] | [.number, .headRefOid, .isCrossRepository] | @tsv')
          echo "open PRs: $(grep -c . <<<"$prs" || true)"
          while IFS=$'\t' read -r num sha cross; do
            [ -z "$num" ] && continue
            if [ "$cross" = "true" ]; then
              approved=$(gh api "repos/$REPO/commits/$sha/statuses" \
                -q 'any(.[]; .context=="preview-approved" and .state=="success")')
              if [ "$approved" != "true" ]; then
                echo "  PR #$num → fork PR, head ${sha:0:8} not preview-approved — skipping"
                continue
              fi
            fi
            gather_artifact ".workflow_run.head_sha == \"$sha\"" "pr-$num" "PR #$num"
          done <<< "$prs"

      # Highest priority: the current build overwrites anything gathered above.
      # Skipped on the dispatch paths (version-name is ""), which gather purely from durable sources.
      - name: Download this run's docs artifact
        if: inputs.version-name != ''
        uses: actions/download-artifact@v8
        with:
          name: docs
          path: ${{ runner.temp }}/gather-current
      - name: Stage current build
        if: inputs.version-name != ''
        env:
          ARTIFACT_VERSION_NAME: ${{ inputs.version-name }}
        run: |
          set -euo pipefail
          src="$RUNNER_TEMP/gather-current/docs.zip"
          [ -f "$src" ] || { echo "::error::in-run artifact not found at $src"; exit 1; }
          size=$(stat -c%s "$src")
          mv "$src" "$RUNNER_TEMP/gather/$ARTIFACT_VERSION_NAME.zip"
          echo "staged this run's build as $ARTIFACT_VERSION_NAME.zip ($size B) — overrides any same-named durable source"
          printf '%s\tthis run\tin-run docs artifact (%s B)\n' "$ARTIFACT_VERSION_NAME" "$size" \
            >> "$RUNNER_TEMP/provenance.tsv"

      # Final fallback: if no prior step provided $DEFAULT.zip, try the durable in-site
      # copy. Hard-fail if it isn't there — a deploy missing the default branch is a hole.
      - name: Ensure default-branch zip
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ -f "$RUNNER_TEMP/gather/$DEFAULT.zip" ]; then
            echo "$DEFAULT.zip already supplied by an earlier rung ($(stat -c%s "$RUNNER_TEMP/gather/$DEFAULT.zip") B) — see the provenance table in the job summary"
            exit 0
          fi
          if curl -fsSL "$PAGES_URL/$SOURCES_DIR/$DEFAULT.zip" \
              -o "$RUNNER_TEMP/gather/$DEFAULT.zip" 2>/dev/null; then
            echo "::notice::$DEFAULT restored from durable in-site copy ($PAGES_URL/$SOURCES_DIR/$DEFAULT.zip)"
            printf '%s\t_sources\trestored from %s (%s B)\n' "$DEFAULT" \
              "$PAGES_URL/$SOURCES_DIR/$DEFAULT.zip" "$(stat -c%s "$RUNNER_TEMP/gather/$DEFAULT.zip")" \
              >> "$RUNNER_TEMP/provenance.tsv"
          else
            echo "::error::$DEFAULT: not provided by current build, releases, branch CI, or durable in-site copy — deploy aborted"
            exit 1
          fi

      # Unzip every gathered zip into SITE/<version-name>.
      # Persist the default-branch zip into SITE/_sources/ for future recovery.
      #
      # THE ZIP-SHAPE CONTRACT: a docs.zip must unzip to exactly ONE top-level
      # directory, whose CONTENTS become site/<version-name>. The directory's NAME is
      # ignored. docs.yml packs `html/`, but release assets are durable and long-lived
      # — a repo migrating from python-copier-template's `_release.yml` has immutable
      # releases carrying zips rooted at the TAG NAME (`mv html $GITHUB_REF_NAME;
      # zip -r docs.zip $GITHUB_REF_NAME`), which cannot be re-cut. Keying on `html/`
      # silently dropped every one of those releases from the switcher. Anything else
      # — no entries, several entries, or files loose at the zip root — is malformed
      # (nothing is known to produce it) and warns + skips rather than guessing.
      - name: Extract artifacts into site
        run: |
          set -euo pipefail
          echo "extracting $(ls -1 "$RUNNER_TEMP/gather"/*.zip 2>/dev/null | wc -l) gathered zip(s) into the site tree:"
          for f in "$RUNNER_TEMP/gather"/*.zip; do
            [ -f "$f" ] || continue
            name=$(basename "$f" .zip)
            tmp=$(mktemp -d)
            if ! unzip -q "$f" -d "$tmp" 2>/dev/null; then
              echo "::warning::$name: could not unzip docs.zip — skipping"
              rm -rf "$tmp"; continue
            fi
            # -print0/-d '' so the count is exact whatever the entries are named,
            # and dotfiles at the root count too (they would be a malformed zip).
            roots=(); mapfile -d '' -t roots < <(find "$tmp" -mindepth 1 -maxdepth 1 -print0)
            if [ "${#roots[@]}" -eq 1 ] && [ -d "${roots[0]}" ]; then
              rm -rf "$RUNNER_TEMP/site/$name"
              mv "${roots[0]}" "$RUNNER_TEMP/site/$name"
              echo "  $name ← zip root '${roots[0]##*/}' ($(find "$RUNNER_TEMP/site/$name" -type f | wc -l) files, $(du -sh "$RUNNER_TEMP/site/$name" | cut -f1))"
            else
              found=$(printf '%s ' "${roots[@]##*/}")
              echo "::warning::$name: docs.zip must unzip to exactly one top-level directory — found [${found% }] — skipping"
            fi
            rm -rf "$tmp"
          done
          dzip="$RUNNER_TEMP/gather/$DEFAULT.zip"
          [ -d "$RUNNER_TEMP/site/$DEFAULT" ] && [ -f "$dzip" ] \
            && { mkdir -p "$RUNNER_TEMP/site/$SOURCES_DIR"; cp "$dzip" "$RUNNER_TEMP/site/$SOURCES_DIR/$DEFAULT.zip"; } \
            || true

      # `generate` orders versions, writes switcher.json + index.html, and prints the
      # stable-alias source dir (the newest release), or "" when no release is deployed yet.
      # Hard-fails if the default branch is absent (Ensure step guarantees the zip, but
      # the extract could still fail if the zip was malformed).
      - name: Generate switcher.json and stable alias
        run: |
          set -euo pipefail
          # assemble.mjs puts its diagnostics (sorted versions, preferred, redirect target,
          # stable source) on stderr and only the stable-alias dir on stdout. Tee stderr to
          # a file so the summary step can reprint them on the run page.
          stable_src=$(node "$GITHUB_WORKSPACE/.mvs/assemble/assemble.mjs" generate \
            --site-dir "$RUNNER_TEMP/site" --base-url "$PAGES_URL" --required "$DEFAULT" \
            2>"$RUNNER_TEMP/generate.log")
          cat "$RUNNER_TEMP/generate.log" >&2
          [ -n "$stable_src" ] && ln -s "$stable_src" "$RUNNER_TEMP/site/stable" || true

      # The single artifact a future post-mortem should need: what got deployed, where
      # each version came from, and what the kernel decided — on the run's summary page,
      # no log download. Sources come from provenance.tsv, last line per version winning
      # (that ordering is the priority chain).
      - name: Site inventory and job summary
        run: |
          set -euo pipefail
          site="$RUNNER_TEMP/site"
          prov="$RUNNER_TEMP/provenance.tsv"
          echo "── deployed tree ──"
          ls -la "$site"
          {
            echo "## Versioned docs site"
            echo
            echo "| version | source | detail | size |"
            echo "|---|---|---|---|"
            for d in "$site"/*/; do
              name=$(basename "$d")
              case "$name" in "$SOURCES_DIR"|stable) continue ;; esac
              src=$(awk -F'\t' -v v="$name" '$1==v {s=$2} END {print s}' "$prov")
              det=$(awk -F'\t' -v v="$name" '$1==v {d=$3} END {print d}' "$prov")
              printf '| `%s` | %s | %s | %s |\n' "$name" "${src:-unknown}" "${det:-—}" \
                "$(du -sh "$d" | cut -f1)"
            done
            echo
            echo '```'
            cat "$RUNNER_TEMP/generate.log"
            echo '```'
            echo
            echo "<details><summary>switcher.json</summary>"
            echo
            echo '```json'
            cat "$site/switcher.json"
            echo '```'
            echo
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ runner.temp }}/site

      # Deploy the uploaded artifact. deploy-pages stamps the deployment with
      # pages_build_version = GITHUB_SHA and has no input to change it; the value is
      # server-validated against the OIDC commit claim, so it CANNOT be overridden
      # (a custom value 404s — actions/deploy-pages#383). The Pages backend silently
      # DROPS a *second* deploy of an already-deployed SHA on a non-`workflow_dispatch`
      # event (it reports success but the origin keeps serving the first artifact),
      # EXCEPT a `workflow_dispatch` deploy of that SHA, which forces a re-serve. A
      # release tag shares the default branch's just-deployed SHA, so an inline tag
      # deploy would be dropped — which is why tags go through the `re-dispatch` job
      # below (re-fired as workflow_dispatch) instead of here. main/internal-PR
      # deploys are the FIRST of their SHA, so they serve fine inline. The Verify step
      # below backstops any residual stale-origin case.
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      # deploy-pages reports success once the deployment RECORD flips active — even
      # if the Pages backend silently fails to update the SERVED origin (a wedged
      # site can serve a stale artifact indefinitely; see the 2026-06 incident where
      # a gh-pages→Actions cutover froze the origin while every deploy reported OK).
      # The re-dispatch (deploy via workflow_dispatch) prevents the tag-after-merge
      # drop; this is the backstop that turns any *other* stale-origin failure into a
      # red check instead of silently serving old docs. Confirm the live switcher.json
      # byte-matches the one we just assembled, polling up to ~6 min — the window is
      # generous because a release deploys TWICE in quick succession on the same SHA (the
      # merge-to-default-branch push, then the tag re-dispatch), and the second (dispatch)
      # re-serve can take a few minutes to propagate to the origin behind the first
      # (observed ~4 min on 2026-06-25). The loop exits the instant the origin matches,
      # so a fast/first-of-SHA deploy isn't slowed. On failure, dump the origin headers
      # (a frozen etag/last-modified is the wedge signature).
      - name: Verify the deployed origin matches what we assembled
        id: verify
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          SITE_DIR: ${{ runner.temp }}/site
        run: |
          set -euo pipefail
          [ -n "$PAGE_URL" ] || { echo "::error::deploy-pages did not report a page_url"; exit 1; }
          local_json="$SITE_DIR/switcher.json"
          [ -f "$local_json" ] || { echo "::error::no switcher.json at $local_json"; exit 1; }
          # Command substitution strips trailing newlines from both sides, so the
          # comparison is robust to a curl/file trailing-newline difference.
          want=$(cat "$local_json")
          url="${PAGE_URL%/}/switcher.json"
          timeout_s=360
          deadline=$(( $(date +%s) + timeout_s ))
          attempt=0
          while :; do
            attempt=$((attempt + 1))
            got=$(curl -fsS "$url?cb=$(date +%s%N)" || true)   # cache-bust → hit the origin
            if [ -n "$got" ] && [ "$got" = "$want" ]; then
              echo "origin matches the assembled switcher.json (attempt $attempt)"
              exit 0
            fi
            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "::error::live switcher.json still does not match the assembled one after ${timeout_s}s — Pages origin likely stale/wedged"
              echo "--- origin headers (frozen etag/last-modified ⇒ wedged) ---"
              curl -sI "$url?cb=$(date +%s%N)" | grep -iE '^(HTTP/|etag|last-modified|age)' | tr -d '\r'
              # Which versions actually differ — usually all you need to tell a stale
              # origin (identical sets, different bytes) from a bad gather (missing entries).
              a=$(jq -r '.[].version' <<<"$want" 2>/dev/null | sort || true)
              b=$(jq -r '.[].version' <<<"$got" 2>/dev/null | sort || true)
              echo "--- version diff ---"
              echo "missing from live: $(comm -23 <(printf '%s\n' "$a") <(printf '%s\n' "$b") | tr '\n' ' ')"
              echo "extra in live:     $(comm -13 <(printf '%s\n' "$a") <(printf '%s\n' "$b") | tr '\n' ' ')"
              echo "--- assembled ($local_json) ---"; printf '%s\n' "$want"
              echo "--- live ($url) ---"; printf '%s\n' "$got"
              exit 1
            fi
            sleep 5
          done

      # A verify failure means the origin is wedged (see comment above) — and per
      # observed external evidence (actions/deploy-pages#383: waiting longer does NOT
      # recover a wedged origin, only a genuinely NEW deploy attempt does), the fix is a
      # fresh workflow_dispatch, not a longer timeout. This must be a fresh dispatch and
      # NOT a job rerun — rerunning would stack a second `github-pages` artifact under
      # this same run and break deploy-pages' artifact lookup ("Multiple artifacts named
      # github-pages"). Only tag/release deploys carry a retry-until budget (set by the
      # re-dispatch job below, from the release's publish time, carried unchanged through
      # each retry) — that's the same-SHA dedup wedge this targets, which a push/PR/manual
      # deploy can't hit (those are always first-of-SHA). No budget → no auto-retry, just
      # the red check.
      - name: Retry via a fresh dispatch if the origin is wedged
        if: failure() && steps.verify.outcome == 'failure' && inputs.retry-until != ''
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          WF: ${{ inputs.dispatch-workflow }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          RETRY_UNTIL: ${{ inputs.retry-until }}
        run: |
          set -euo pipefail
          if [ "$(date +%s)" -ge "$RETRY_UNTIL" ]; then
            echo "::error::origin still wedged past the retry deadline ($(date -d "@$RETRY_UNTIL" -Is)) — giving up, manual re-dispatch needed"
            exit 0
          fi
          gh workflow run "$WF" --repo "$REPO" --ref "$DEFAULT_BRANCH" -f retry-until="$RETRY_UNTIL"
          echo "::notice::origin wedged — dispatched a fresh retry (budget until $(date -d "@$RETRY_UNTIL" -Is))"

  # A tag can't deploy inline (same SHA as the default-branch push → Pages drops it
  # unless the event is workflow_dispatch). Wait for the tag's docs.zip to actually be
  # attached to its release, then re-dispatch the shim so the deploy runs on a
  # workflow_dispatch event and re-serves.
  re-dispatch:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: read     # gh release view
      actions: write     # gh workflow run (re-dispatch the shim)
    steps:
      - name: Wait for the tag's docs.zip, then re-deploy via workflow_dispatch
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          WF: ${{ inputs.dispatch-workflow }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail

          # WAIT FOR THE ASSET, NOT THE RELEASE RECORD. The deploy's gather selects
          # releases by their docs.zip ASSET; the release RECORD can exist long before
          # that asset lands. Repos that publish a release from the GitHub UI create the
          # record (and the tag, and therefore this run) *first* and let ci.yml's release
          # job clobber the asset in minutes later — so waiting on the record is a no-op
          # there, the deploy lists releases before the upload, and the tag silently drops
          # out of its own deploy (observed on every blueapi release: each one shipped a
          # site missing itself, healed only by the *next* release's deploy).
          #
          # Repos whose release is created by release.yml (draft → upload → publish) are
          # immune — publishedAt already implies the assets — but they cost nothing here.

          # Does this repo attach docs.zip to releases at all? If no release ever has,
          # release assets aren't a source for it and there is nothing to wait for.
          # (Anything other than a clean "false" — including a failed API call — falls
          # through to waiting, because waiting is the safe default.)
          expect_asset=$(gh api --paginate "repos/$REPO/releases" \
            | jq -rs 'add // [] | any(.[]; any(.assets[]; .name=="docs.zip"))' || echo unknown)

          # 1. The release RECORD (3 min) — a tag with no release at all is a failed
          #    release job, and no amount of waiting fixes it.
          published_at=""
          for _ in $(seq 1 36); do
            published_at=$(gh release view "$TAG" --repo "$REPO" --json publishedAt -q .publishedAt 2>/dev/null) && break
            sleep 5
          done
          [ -n "$published_at" ] \
            || { echo "::error::release $TAG not found after 3 min — did the release job fail?"; exit 1; }
          echo "release $TAG published at $published_at"

          # 2. The docs.zip ASSET (30 min) — the release job typically needs the full
          #    test matrix, so the budget must cover a slow one, not just a fast build.
          asset_ok=true
          if [ "$expect_asset" = false ]; then
            echo "::notice::no release in $REPO carries a docs.zip asset — not waiting for one"
          else
            t0=$(date +%s)
            deadline=$(( t0 + 1800 ))
            while :; do
              assets=$(gh release view "$TAG" --repo "$REPO" --json assets \
                -q '.assets[] | [.name, .size, .createdAt] | @tsv' 2>/dev/null || true)
              if grep -q '^docs\.zip' <<<"$assets"; then
                echo "docs.zip attached after $(( $(date +%s) - t0 ))s:"
                printf '%s\n' "$assets"
                break
              fi
              if [ "$(date +%s)" -ge "$deadline" ]; then
                echo "::error::release $TAG still has no docs.zip asset after 30 min — the \
          release job either failed or does not attach one. Re-dispatching anyway so the \
          rest of the site refreshes, but $TAG will be MISSING from the deployed switcher."
                printf 'assets on %s:\n%s\n' "$TAG" "${assets:-<none>}"
                asset_ok=false
                break
              fi
              sleep 10
            done
          fi

          # Retry budget for a wedged Pages origin, anchored on NOW — i.e. on the asset's
          # arrival, the moment the deploy actually becomes possible. (It used to anchor
          # on publishedAt, which a UI-published release sets before CI even starts, so a
          # slow build could burn the whole budget before the first deploy attempt.) The
          # commit's own timestamp is never the anchor: a tag can be cut long after its
          # commit was merged, which would wrongly disqualify the exact same-SHA dedup
          # wedge (deploy-pages#383) this budget exists to retry through.
          retry_until=$(( $(date +%s) + 900 ))

          before=$(gh run list --repo "$REPO" --workflow "$WF" --event workflow_dispatch \
            --limit 1 --json databaseId -q '.[0].databaseId' 2>/dev/null || true)
          gh workflow run "$WF" --repo "$REPO" --ref "$DEFAULT_BRANCH" -f retry-until="$retry_until"

          # gh workflow run prints no run id — poll briefly so the log links the run it
          # started, which is where the actual deploy (and any failure) will be.
          id=""
          for _ in $(seq 1 6); do
            sleep 5
            id=$(gh run list --repo "$REPO" --workflow "$WF" --event workflow_dispatch \
              --limit 1 --json databaseId -q '.[0].databaseId' 2>/dev/null || true)
            if [ -n "$id" ] && [ "$id" != "$before" ]; then break; fi
            id=""
          done
          msg="re-dispatched $WF for $TAG (retry budget until $(date -d "@$retry_until" -Is))"
          if [ -n "$id" ]; then msg="$msg → $GITHUB_SERVER_URL/$REPO/actions/runs/$id"; fi
          echo "::notice::$msg"

          # Loud, not silent: the dispatch went out so the rest of the site refreshes, but
          # this tag is not in it.
          [ "$asset_ok" = true ] || exit 1
